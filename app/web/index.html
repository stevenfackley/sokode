<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by the value of `flutter build web --base-href`. Keep it: the
    Cloudflare Pages deploy serves from the domain root ("/"), but preview
    builds and sub-path hosting depend on this being substitutable.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sokode is a grid puzzle maker and player. Levels travel as share codes that carry their own solution proof, so an unsolvable level can never be shared to you.">
  <meta name="theme-color" content="#00695C">

  <!--
    Shared levels arrive as sokode.com/#<code>. The URL fragment is never
    sent to the server, so shared levels stay out of access logs by
    construction (spec §5) — do not "improve" this into a query parameter.
  -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sokode">
  <meta property="og:description" content="Build a grid puzzle, solve it, share it as a self-verifying code.">
  <meta name="twitter:card" content="summary">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sokode">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sokode</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
