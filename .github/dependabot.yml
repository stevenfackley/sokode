version: 2
updates:
  - package-ecosystem: pub
    directories:
      - /app
      - /packages/sokode_core
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      pub-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
